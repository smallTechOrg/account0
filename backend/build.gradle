plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.account0'
version = '0.1.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.compilerArgs << '-parameters' }

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform(); testLogging { events 'failed'; exceptionFormat 'full' } }

// Regenerates realistic fake Indian GST invoice PDFs under ../fixtures/invoices
tasks.register('generateFixtures', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.account0.fixtures.FixtureGenerator'
    args file('../fixtures/invoices').absolutePath
}
